
name: Build, Push and Deploy Wine Quality API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "786896018605"
  ECR_REPOSITORY: wine-quality-api
  EC2_INSTANCE_ID: i-082b09fa8ecc937c3

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786896018605:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            786896018605.dkr.ecr.eu-north-1.amazonaws.com/wine-quality-api:${{ github.sha }}
            786896018605.dkr.ecr.eu-north-1.amazonaws.com/wine-quality-api:latest

      - name: Deploy to EC2 through Systems Manager
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -Eeuo pipefail

          REGION="eu-north-1"
          ACCOUNT_ID="786896018605"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          IMAGE="__IMAGE__"
          CONTAINER="wine-quality-api"

          echo "Pulling exact commit image: $IMAGE"
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE"

          OLD_IMAGE=""
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            OLD_IMAGE="$(docker inspect -f '{{.Image}}' "$CONTAINER")"
            docker rm -f "$CONTAINER"
          fi

          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"

         
          echo "Waiting for SSM command: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            RESULT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --region "$AWS_REGION" \
              --output json) || {
                echo "ERROR: Unable to retrieve SSM command status."
                exit 1
              }

            STATUS=$(echo "$RESULT" | jq -r \
              --arg instance "$EC2_INSTANCE_ID" \
              '.CommandInvocations[] |
               select(.InstanceId == $instance) |
               .Status' | head -n 1)

            echo "Attempt $attempt/60 — SSM status: ${STATUS:-Not available}"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                echo "$RESULT" | jq -r \
                  --arg instance "$EC2_INSTANCE_ID" \
                  '.CommandInvocations[] |
                   select(.InstanceId == $instance) |
                   .CommandPlugins[]? |
                   .Output // empty'
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed with SSM status: $STATUS"
                echo "$RESULT" | jq \
                  --arg instance "$EC2_INSTANCE_ID" \
                  '.CommandInvocations[] |
                   select(.InstanceId == $instance)'
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "ERROR: Unexpected SSM status: $STATUS"
                echo "$RESULT" | jq .
                exit 1
                ;;
            esac
          done

          echo "ERROR: SSM command did not reach a terminal status within 5 minutes."
          echo "Command ID: $COMMAND_ID"
          exit 1
