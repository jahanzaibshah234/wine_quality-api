
name: Build, Push and Deploy Wine Quality API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wine-quality-api-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "786896018605"
  ECR_REPOSITORY: wine-quality-api
  EC2_INSTANCE_ID: i-082b09fa8ecc937c3

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          python -m pytest -v


      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::786896018605:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            786896018605.dkr.ecr.eu-north-1.amazonaws.com/wine-quality-api:${{ github.sha }}
            786896018605.dkr.ecr.eu-north-1.amazonaws.com/wine-quality-api:latest

      - name: Deploy to EC2 through Systems Manager
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Preparing deployment for image: $IMAGE"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          
          set -Eeuo pipefail
          
          REGION="eu-north-1"
          ACCOUNT_ID="786896018605"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          IMAGE="__IMAGE__"
          CONTAINER="wine-quality-api"
          CANDIDATE="${CONTAINER}-candidate"
          OLD_IMAGE=""
          
          check_health() {
            local name="$1"
            local attempt
          
            for attempt in $(seq 1 30); do
              if docker exec "$name" python -c \
                "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read().decode())" \
                2>/dev/null; then
                return 0
              fi
              sleep 2
            done
          
            return 1
          }
          
          rollback() {
            echo "Attempting rollback..."
          
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          
            if [ -n "$OLD_IMAGE" ]; then
              if docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p 8000:8000 \
                "$OLD_IMAGE"; then
          
                if check_health "$CONTAINER"; then
                  echo "SUCCESS: Previous version restored and healthy."
                  return 0
                fi
          
                echo "ERROR: Previous version started but failed health checks."
                docker logs "$CONTAINER" || true
              fi
            else
              echo "No previous image available for rollback."
            fi
          
            return 1
          }
          
          echo "Authenticating with ECR..."
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          
          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"
          
          # Preserve the currently deployed image.
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            OLD_IMAGE="$(docker inspect -f '{{.Image}}' "$CONTAINER")"
            echo "Previous image: $OLD_IMAGE"
          fi
          
          # Test the candidate on a temporary container and port.
          # The existing production container remains untouched here.
          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
          
          echo "Starting candidate container..."
          if ! docker run -d \
            --name "$CANDIDATE" \
            -p 127.0.0.1:18000:8000 \
            "$IMAGE"; then
            echo "ERROR: Candidate container could not start."
            exit 1
          fi
          
          if ! check_health "$CANDIDATE"; then
            echo "ERROR: Candidate failed health checks."
            docker logs "$CANDIDATE" || true
            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            echo "Existing production container has not been changed."
            exit 1
          fi
          
          echo "Candidate passed health checks."
          docker rm -f "$CANDIDATE"
          
          # The candidate passed. Replace the production container.
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          
          echo "Starting production container..."
          if docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"; then
          
            if check_health "$CONTAINER"; then
              echo "SUCCESS: New production version is healthy."
              exit 0
            fi
          fi
          
          echo "ERROR: New production version failed."
          docker logs "$CONTAINER" || true
          
          if rollback; then
            exit 1
          fi
          
          echo "CRITICAL: Automatic rollback failed. Manual recovery is required."
          exit 1

          SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE__/$IMAGE}"

          PARAMETERS="$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')"

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Wine Quality API commit ${IMAGE_TAG}" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            if ! RESULT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --region "$AWS_REGION" \
              --output json 2>&1); then
              echo "ERROR: Could not retrieve SSM status:"
              echo "$RESULT"
              exit 1
            fi

            STATUS=$(echo "$RESULT" | jq -r \
              --arg instance "$EC2_INSTANCE_ID" \
              '[.CommandInvocations[] |
                select(.InstanceId == $instance) |
                .Status][0] // empty')

            echo "Attempt $attempt/60 — SSM status: ${STATUS:-Not available}"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                echo "$RESULT" | jq -r \
                  --arg instance "$EC2_INSTANCE_ID" \
                  '.CommandInvocations[] |
                   select(.InstanceId == $instance) |
                   .CommandPlugins[]? |
                   .Output // empty'
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed: $STATUS"
                echo "$RESULT" | jq \
                  --arg instance "$EC2_INSTANCE_ID" \
                  '.CommandInvocations[] |
                   select(.InstanceId == $instance)'
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                echo "$RESULT" | jq .
                exit 1
                ;;
            esac
          done

          echo "ERROR: SSM did not reach a terminal status within 5 minutes."
          echo "Command ID: $COMMAND_ID"
          exit 1
